<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>America's Reading Slide</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Source+Sans+3:wght@400;500;600&display=swap');
:root{
  --ink:#1a1208;--red:#8b1a1a;--paper:#fbf8f1;--cream:#f5f0e8;--tan:#d4c4a8;--muted:#75644d;--soft:#f3e7e7;--dark:#2c1010;
}
*{box-sizing:border-box} html,body{margin:0;padding:0;background:transparent;color:var(--ink);font-family:'Source Sans 3',system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
#reading-slide{width:100%;max-width:980px;margin:0 auto;padding:18px;background:var(--paper);border:1px solid var(--tan);border-radius:5px;box-shadow:0 22px 44px -36px rgba(26,18,8,.55);position:relative;overflow:hidden}
.header{text-align:center;margin-bottom:12px;animation:headerIn .65s cubic-bezier(.2,.8,.2,1) both}.title{font-family:'Space Grotesk',system-ui,sans-serif;font-size:clamp(28px,4.2vw,46px);letter-spacing:-.035em;line-height:.98;font-weight:700;margin:4px 0 4px}.title span{color:var(--red)}.dek{font-size:13px;color:var(--muted);letter-spacing:.04em}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:12px;align-items:stretch;animation:gridIn .7s .08s cubic-bezier(.2,.8,.2,1) both}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{position:relative;min-height:190px;padding:12px 12px 10px;background:linear-gradient(180deg,#fffaf3 0%,var(--paper) 100%);border:1px solid var(--tan);border-radius:4px;cursor:pointer;text-align:left;overflow:hidden;opacity:0;animation:cardIn .5s calc(var(--i,0)*70ms + 120ms) cubic-bezier(.2,.8,.2,1) forwards;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,border-color .22s ease,background .22s ease}.card:hover,.card:focus-visible{transform:translateY(-5px) scale(1.015);box-shadow:0 18px 30px -20px rgba(26,18,8,.7);border-color:var(--red);outline:none}.card:active{transform:translateY(-1px) scale(.985)}.card.active{background:var(--soft);border-color:var(--red);box-shadow:inset 0 0 0 1px rgba(139,26,26,.08)}.card svg{position:absolute;right:9px;top:9px;width:34px;height:34px;opacity:.12;stroke:var(--red);fill:none;stroke-width:1.7;transform-origin:center;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s ease}.card:hover svg,.card:focus-visible svg,.card.active svg{transform:translateY(-2px) rotate(-4deg) scale(1.08);opacity:.2}.stat-wrap{display:flex;justify-content:center;margin-top:22px}.stat-ring{--fill:0%;width:88px;height:88px;border-radius:50%;padding:8px;background:conic-gradient(from -90deg,var(--red) 0 var(--fill),var(--cream) var(--fill) 100%);box-shadow:inset 0 0 0 1px rgba(212,196,168,.7);transition:--fill .9s cubic-bezier(.2,.8,.2,1),transform .25s ease}.card:hover .stat-ring,.card:focus-visible .stat-ring{transform:scale(1.05)}.stat-ring.static{padding:2px;background:var(--tan);box-shadow:none}.stat-ring-inner{width:100%;height:100%;border-radius:50%;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:background .15s ease}.card.active .stat-ring-inner{background:var(--soft)}.stat-value{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:29px;line-height:.95;color:var(--ink);letter-spacing:-.035em;transition:transform .25s ease,color .25s ease}.card:hover .stat-value,.card:focus-visible .stat-value{transform:scale(1.08)}.stat-ring.percent .stat-value,.stat-ring.emphasis .stat-value{color:var(--red)}.ring-unit{font-size:8.5px;line-height:1.05;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-top:4px;max-width:58px}.sub{font-size:12.5px;line-height:1.25;color:var(--muted);margin-top:9px;text-align:center;min-height:32px;transition:color .2s ease,transform .2s ease}.card:hover .sub,.card:focus-visible .sub{color:var(--ink);transform:translateY(1px)}.panel{border:1px solid var(--tan);border-radius:4px;padding:13px;background:#fffaf3;display:flex;flex-direction:column;justify-content:space-between;min-height:316px;overflow:hidden}.panel>*{animation:panelIn .38s cubic-bezier(.2,.8,.2,1) both}.panel-head{display:flex;align-items:start;justify-content:space-between;gap:12px}.panel h2{font-family:'Space Grotesk',system-ui,sans-serif;font-size:24px;line-height:1;margin:0;letter-spacing:-.02em}.badge{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--red);border:1px solid #e2c9c9;background:var(--soft);padding:6px 8px;border-radius:999px;white-space:nowrap}.callout{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;margin:12px 0}.circle{--fill:0%;width:92px;height:92px;border-radius:50%;padding:9px;background:conic-gradient(from -90deg,var(--red) 0 var(--fill),var(--cream) var(--fill) 100%);box-shadow:inset 0 0 0 1px rgba(212,196,168,.7);transition:--fill .9s cubic-bezier(.2,.8,.2,1);animation:ringPop .45s .08s cubic-bezier(.2,.8,.2,1) both}.circle.static{padding:2px;background:var(--tan);box-shadow:none}.circle-inner{width:100%;height:100%;border-radius:50%;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:24px;line-height:.95}.circle.percent .circle-inner{color:var(--red)}.circle-unit{font-family:'Source Sans 3',system-ui,sans-serif;font-size:8.5px;line-height:1.05;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-top:4px;max-width:62px}.explain{font-size:14px;line-height:1.48;color:var(--muted)}.mini-chart{border-top:1px solid var(--tan);padding-top:11px}.chart-row{display:grid;grid-template-columns:52px 1fr 45px;gap:8px;align-items:center;margin:8px 0;font-size:12px;color:var(--muted)}.bar{height:10px;background:var(--cream);border:1px solid var(--tan);border-radius:2px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:var(--red);transition:width .75s cubic-bezier(.2,.8,.2,1)}.note{font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:8px}.detail-widget{width:100%;margin-top:12px;padding:12px 13px;border:1px solid var(--red);border-radius:4px;background:var(--soft);color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;cursor:pointer;animation:detailIn .45s .12s cubic-bezier(.2,.8,.2,1) both;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,background .22s ease}.detail-widget:hover,.detail-widget:focus-visible{transform:translateY(-1px);box-shadow:0 12px 22px -18px rgba(26,18,8,.75);background:#ecdada;outline:2px solid rgba(139,26,26,.22);outline-offset:2px}.detail-copy{display:flex;flex-direction:column;gap:2px}.detail-eyebrow{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700}.detail-label{font-family:'Space Grotesk',system-ui,sans-serif;font-size:15px;font-weight:700;line-height:1.15}.detail-arrow{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:#fff;font-size:16px;line-height:1;flex:0 0 auto;transition:transform .25s cubic-bezier(.2,.8,.2,1)}.detail-widget:hover .detail-arrow,.detail-widget:focus-visible .detail-arrow{transform:translateX(4px) rotate(-8deg)}.source{font-size:10.5px;color:var(--muted);border-top:1px solid var(--tan);padding-top:9px;margin-top:8px}.footer{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:11px;font-size:11.5px;color:var(--muted);letter-spacing:.06em;animation:footerIn .6s .25s ease both}.footer .rule{height:1px;background:var(--tan);flex:1}.modal-backdrop{position:absolute;inset:0;background:rgba(26,18,8,.46);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10;opacity:0;visibility:hidden;pointer-events:none;backdrop-filter:blur(0);transition:opacity .28s ease,backdrop-filter .28s ease,visibility 0s linear .28s}.modal-backdrop.show{opacity:1;visibility:visible;pointer-events:auto;backdrop-filter:blur(3px);transition:opacity .28s ease,backdrop-filter .28s ease,visibility 0s}.modal{width:min(720px,96%);background:var(--paper);border:1px solid var(--tan);box-shadow:0 30px 70px -22px rgba(0,0,0,.55);border-radius:5px;padding:18px;position:relative;opacity:0;transform:translateY(24px) scale(.94);transition:opacity .3s ease,transform .36s cubic-bezier(.2,.9,.2,1)}.modal-backdrop.show .modal{opacity:1;transform:translateY(0) scale(1)}.close{position:absolute;right:11px;top:9px;border:1px solid var(--tan);background:#fffaf3;color:var(--ink);font-size:22px;line-height:1;width:34px;height:34px;border-radius:50%;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),background .2s ease,border-color .2s ease}.close:hover,.close:focus-visible{transform:rotate(90deg) scale(1.08);background:var(--soft);border-color:var(--red);outline:none}.close:active{transform:rotate(90deg) scale(.92)}.modal-title{font-family:'Space Grotesk',system-ui,sans-serif;font-size:31px;font-weight:700;letter-spacing:-.03em;line-height:1;margin:8px 44px 8px 0}.modal-main{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:center}.modal-stat{font-family:'Space Grotesk',system-ui,sans-serif;font-size:60px;font-weight:700;color:var(--red);line-height:1;text-align:center;border:1px solid var(--tan);background:#fffaf3;border-radius:4px;padding:25px 6px}.modal-text{font-size:16px;line-height:1.55;color:var(--muted)}.modal-mini{margin-top:14px;border-top:1px solid var(--tan);padding-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini-box{background:#fffaf3;border:1px solid var(--tan);padding:10px;border-radius:3px;opacity:0;transform:translateY(10px)}.modal-backdrop.show .mini-box{animation:miniBoxIn .4s .16s ease forwards}.modal-backdrop.show .mini-box:nth-child(2){animation-delay:.23s}.mini-box .small-head{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:7px}.modal-source{font-size:11.5px;color:var(--muted);margin-top:10px}.modal-source a{color:var(--red);text-decoration:none}@property --fill{syntax:'<percentage>';inherits:false;initial-value:0%}
@keyframes headerIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes gridIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;translate:0 16px;scale:.96}to{opacity:1;translate:0 0;scale:1}}
@keyframes panelIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@keyframes ringPop{0%{opacity:0;transform:scale(.78) rotate(-14deg)}100%{opacity:1;transform:none}}
@keyframes detailIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes miniBoxIn{to{opacity:1;transform:none}}
@keyframes footerIn{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
@media(max-width:760px){#reading-slide{padding:14px}.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.panel{min-height:260px}.modal-main{grid-template-columns:1fr}.modal-mini{grid-template-columns:1fr}.modal-stat{font-size:48px;padding:14px}.card{min-height:178px}.stat-ring{width:82px;height:82px}.stat-value{font-size:27px}}
@media(max-width:450px){.cards{grid-template-columns:1fr}.footer{display:none}}
</style>
</head>
<body>
<section id="reading-slide" aria-label="America's Reading Slide interactive infographic">
  <div class="header">
    <div class="title">America’s Reading <span>Slide</span></div>
    <div class="dek">Select a card, then use the detail widget to open the full story.</div>
  </div>
  <div class="grid">
    <div class="cards" id="cards"></div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
  <div class="footer"><span class="rule"></span><span>NAEP • NAGB • Scholastic • Common Sense Media • OECD</span><span class="rule"></span></div>
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modalTitle">
    <div class="modal">
      <button class="close" id="modalClose" aria-label="Close popup">×</button>
      <div id="modalContent"></div>
    </div>
  </div>
</section>
<script>
const icons={
  score:`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 51h44M16 47V28m16 19V14m16 33V22"/><path d="M13 28h6m10-14h6m10 8h6"/></svg>`,
  basic:`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 8 58 54H6Z"/><path d="M32 23v15M32 46h.1"/></svg>`,
  fun:`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M12 14h18a8 8 0 0 1 8 8v30a8 8 0 0 0-8-8H12Z"/><path d="M52 14H38a8 8 0 0 0-8 8v30a8 8 0 0 1 8-8h14Z"/></svg>`,
  screen:`<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="18" y="7" width="28" height="50" rx="5"/><path d="M27 49h10M24 16h16"/></svg>`,
  print:`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M15 16h22a8 8 0 0 1 8 8v24H22a7 7 0 0 0-7 7Z"/><path d="M45 24h8v24h-8M23 25h14M23 34h14"/></svg>`,
  world:`<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="23"/><path d="M9 32h46M32 9c7 7 10 15 10 23s-3 16-10 23M32 9c-7 7-10 15-10 23s3 16 10 23"/></svg>`
};
const data=[
 {id:'score',icon:'score',label:'Reading scores',stat:'−5',unit:'pts',sub:'Grade 4 and 8 reading vs. 2019',pct:60,title:'National reading scores fell again',full:'In 2024, average national reading scores for both fourth and eighth graders were 5 points lower than in 2019, and 2 points lower than in 2022. The decline shows that the decline in reading achievement did not end with the pandemic period.',source:'NAEP / The Nation’s Report Card, 2024 reading results',url:'https://www.nationsreportcard.gov/reports/reading/2024/g4_8/',chart:[['2019','0',100],['2022','−3',65],['2024','−5',42]],miniA:'Grades 4 and 8 both registered the same five-point drop from 2019.',miniB:'NAEP reports scores on a 0–500 scale, so point drops are trend signals rather than percentages.'},
 {id:'basic',icon:'basic',label:'Below basic',stat:'33%',sub:'Eighth graders below NAEP Basic',pct:33,title:'One-third of eighth graders missed NAEP Basic',full:'NAGB summarized the 2024 results by noting that 33% of eighth graders were below the NAEP Basic level in reading, the highest share in NAEP history for grade 8. Below Basic means many students struggled with foundational reading tasks such as main idea, sequence and character traits.',source:'National Assessment Governing Board, 2024 NAEP takeaways',url:'https://www.nagb.gov/powered-by-naep/the-2024-nations-report-card/10-takeaways-from-2024-naep-results.html',chart:[['At/above Basic','67%',67],['Below Basic','33%',33]],miniA:'This makes the score drop feel more concrete: it is not just points, but students missing basic reading benchmarks.',miniB:'The article can connect this to teachers’ concerns about stamina and comprehension.'},
 {id:'fun',icon:'fun',label:'Reading enjoyment',stat:'46%',sub:'Ages 12–17 who enjoy reading',pct:46,title:'Enjoyment falls sharply as students get older',full:'Scholastic’s Kids & Family Reading Report found a major age gap in reading enjoyment: 70% of 6–8-year-olds enjoy reading, compared with 46% of 12–17-year-olds.',source:'Scholastic Kids & Family Reading Report',url:'https://www.scholastic.com/content/corp-home/kids-and-family-reading-report/reading-lives.html',chart:[['Ages 6–8','70%',70],['Ages 12–17','46%',46]],miniA:'This is useful for the local angle because the article focuses on secondary students.',miniB:'It supports the idea that reading is not only a skill problem, but also a motivation problem.'},
 {id:'screen',icon:'screen',label:'Screen media',stat:'5:33',unit:'hrs/day',sub:'Daily screen media for tweens in 2021',pct:69,title:'Screens compete with sustained reading time',full:'The American Academy of Pediatrics cites Common Sense Media’s 2021 census showing that tweens ages 8–12 averaged 5 hours and 33 minutes of entertainment screen media per day. For younger children, Common Sense Media’s 2025 census found screen time around 2.5 hours per day for ages 0–8.',source:'American Academy of Pediatrics citing Common Sense Media; Common Sense Media 2025 census',url:'https://www.aap.org/en/patient-care/media-and-children/center-of-excellence-on-social-media-and-youth-mental-health/qa-portal/qa-portal-library/qa-portal-library-questions/average-amounts-of-screen-time/',chart:[['0–8 yrs','2.5 hrs',30],['8–12 yrs','5.5 hrs',69]],miniA:'The widget avoids saying screens “cause” lower scores, but shows how digital habits compete for attention.',miniB:'This pairs well with teacher quotes about skimming and fast information.'},
 {id:'daily',icon:'print',label:'Daily reading',stat:'14%',sub:'13-year-olds reading for fun almost daily',pct:14,title:'Daily reading for fun is now rare among 13-year-olds',full:'NAEP long-term trend data showed that only 14% of 13-year-olds reported reading for fun almost every day in 2023. That was 13 percentage points lower than in 2012, when 27% reported doing so.',source:'NAEP Long-Term Trend, 2023',url:'https://www.nationsreportcard.gov/highlights/ltt/2023/',chart:[['2012','27%',27],['2020','17%',17],['2023','14%',14]],miniA:'This directly supports the article’s theme that students encounter fewer long reads and read less on their own.',miniB:'NAEP also reported higher scores among students who read for fun almost every day.'},
 {id:'world',icon:'world',label:'Global view',stat:'504',unit:'PISA pts',sub:'U.S. PISA reading score',pct:74,title:'U.S. teens still scored above the OECD average',full:'The international picture is more mixed. In PISA 2022, U.S. 15-year-olds averaged 504 in reading, above the OECD average of 476. Globally, OECD reported that reading performance fell by 10 points on average between 2018 and 2022.',source:'OECD PISA 2022 country profile and results',url:'https://gpseducation.oecd.org/CountryProfile?primaryCountry=USA&topic=PI&treshold=10',chart:[['OECD avg.','476',76],['United States','504',86]],miniA:'This keeps the infographic balanced: U.S. reading is declining, but the U.S. is not at the bottom internationally.',miniB:'It helps separate “national decline” from “global comparison.”'}
];
const cards=document.getElementById('cards'),panel=document.getElementById('panel'),modalBackdrop=document.getElementById('modalBackdrop'),modalContent=document.getElementById('modalContent');let current=data[0];
function animateBars(scope=document){requestAnimationFrame(()=>scope.querySelectorAll('.bar span[data-width]').forEach((bar,i)=>{setTimeout(()=>bar.style.width=bar.dataset.width+'%',i*70)}));}
function animateRings(scope=document){requestAnimationFrame(()=>scope.querySelectorAll('[data-fill]').forEach((ring,i)=>{setTimeout(()=>ring.style.setProperty('--fill',ring.dataset.fill+'%'),i*80+80)}));}
function renderCards(){cards.innerHTML=data.map((d,i)=>{const isPercent=d.stat.includes('%');const ringClass=isPercent?'percent':`static ${d.id==='score'||d.id==='daily'?'emphasis':''}`;const ringData=isPercent?` data-fill="${d.pct}" style="--fill:0%"`:'';const unit=d.unit?`<span class="ring-unit">${d.unit}</span>`:'';return `<button class="card ${i===0?'active':''}" style="--i:${i}" data-id="${d.id}" aria-label="Select ${d.label}" aria-pressed="${i===0?'true':'false'}">${icons[d.icon]}<div class="stat-wrap"><div class="stat-ring ${ringClass}"${ringData}><div class="stat-ring-inner"><span class="stat-value">${d.stat}</span>${unit}</div></div></div><div class="sub">${d.sub}</div></button>`;}).join('');cards.querySelectorAll('.card').forEach(btn=>{btn.addEventListener('click',()=>setActive(btn.dataset.id));});animateRings(cards);}
function chartRows(d){return d.chart.map(r=>`<div class="chart-row"><span>${r[0]}</span><div class="bar"><span data-width="${r[2]}"></span></div><strong>${r[1]}</strong></div>`).join('')}
function setActive(id){current=data.find(d=>d.id===id)||data[0];cards.querySelectorAll('.card').forEach(c=>{const selected=c.dataset.id===id;c.classList.toggle('active',selected);c.setAttribute('aria-pressed',String(selected));});const isPercent=current.stat.includes('%');const circleClass=isPercent?'percent':'static';const circleData=isPercent?` data-fill="${current.pct}" style="--fill:0%"`:'';const circleUnit=current.unit?`<span class="circle-unit">${current.unit}</span>`:'';panel.innerHTML=`<div><div class="panel-head"><h2>${current.title}</h2><div class="badge">Selected topic</div></div><div class="callout"><div class="circle ${circleClass}"${circleData}><div class="circle-inner"><span>${current.stat}</span>${circleUnit}</div></div><div class="explain">${current.sub}</div></div></div><div><div class="mini-chart">${chartRows(current)}</div><button class="detail-widget" type="button" aria-label="View full details for ${current.label}"><span class="detail-copy"><span class="detail-eyebrow">Interactive detail</span><span class="detail-label">View full details</span></span><span class="detail-arrow" aria-hidden="true">→</span></button><div class="source">Source: ${current.source}</div></div>`;panel.querySelector('.detail-widget').addEventListener('click',()=>openModal(current.id));animateRings(panel);animateBars(panel);}
let modalOpener=null;
function openModal(id){const d=data.find(x=>x.id===id)||current;modalOpener=document.activeElement;modalContent.innerHTML=`<div class="modal-title" id="modalTitle">${d.title}</div><div class="modal-main"><div class="modal-stat">${d.stat}</div><div class="modal-text">${d.full}</div></div><div class="modal-mini"><div class="mini-box"><div class="small-head">Mini trend</div>${chartRows(d)}</div><div class="mini-box"><div class="small-head">Why this matters</div><div class="note">${d.miniA}</div><br><div class="note">${d.miniB}</div></div></div><div class="modal-source">Source: <a href="${d.url}" target="_blank" rel="noopener">${d.source}</a></div>`;modalBackdrop.classList.add('show');modalBackdrop.setAttribute('aria-hidden','false');requestAnimationFrame(()=>{animateBars(modalContent);document.getElementById('modalClose').focus();});}
function closeModal(){if(!modalBackdrop.classList.contains('show'))return;modalBackdrop.classList.remove('show');modalBackdrop.setAttribute('aria-hidden','true');setTimeout(()=>{if(modalOpener&&typeof modalOpener.focus==='function')modalOpener.focus();},300);}
document.getElementById('modalClose').addEventListener('click',closeModal);modalBackdrop.addEventListener('click',e=>{if(e.target===modalBackdrop)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});renderCards();setActive('score');
</script>
</body>
</html>
